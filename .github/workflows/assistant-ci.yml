name: assistant CI

concurrency:
  group: assistant-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ["assistant/**", "docs/API.md", "docs/GITHUB.md", ".github/workflows/assistant-ci.yml"]
  pull_request:
    paths: ["assistant/**", "docs/API.md", "docs/GITHUB.md", ".github/workflows/assistant-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: assistant

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      SETTLE_TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assistant/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npm run check:bundle
      - name: Production API smoke (optional)
        if: vars.ASSISTANT_URL != ''
        env:
          ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: npm run smoke:api
