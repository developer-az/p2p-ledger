spring:
  application:
    name: ledger-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DATABASE_USERNAME:ledger}
    password: ${DATABASE_PASSWORD:ledger}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast under overload instead of parking requests for the 30s default.
      connection-timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ledger:
  events:
    sink: ${EVENTS_SINK:log}   # log | kafka | sqs
    kafka-topic: ledger.events
    sqs:
      queue-url: ${SQS_QUEUE_URL:}
      region: ${AWS_REGION:us-east-1}
      endpoint: ${SQS_ENDPOINT:}
  outbox:
    poll-interval-ms: 500
  http:
    # Cap on concurrent API requests; see InFlightLimitFilter.
    max-in-flight: ${MAX_IN_FLIGHT:64}
    queue-wait-ms: 200
