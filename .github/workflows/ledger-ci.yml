name: ledger-service CI

on:
  push:
    branches: [main]
    paths: ["ledger-service/**", "infra/**", ".github/workflows/ledger-ci.yml"]
  pull_request:
    paths: ["ledger-service/**", "infra/**", ".github/workflows/ledger-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start real Postgres and ElasticMQ (SQS) containers via Testcontainers.
      - run: ./mvnw -B verify

  jvm-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ledger-service
          push: false
          tags: ledger-service:jvm
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Native build → runtime smoke test → publish to GHCR → deploy to Render.
  native:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ledger" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          cache: maven
      - name: Compile native executable
        working-directory: ledger-service
        run: ./mvnw -B -Pnative -DskipTests native:compile
      - name: Smoke test the native binary
        working-directory: ledger-service
        run: |
          ./target/ledger-service > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 1; done
          scripts/smoke.sh http://localhost:8080 || { cat app.log; exit 1; }
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ledger-service
          file: ledger-service/Dockerfile.native
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Deploy to Render
        if: github.event_name == 'push'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL not set; skipping deploy"; exit 0; fi
          curl -fsS -X POST "$HOOK&imgURL=$(jq -rn --arg u "ghcr.io/${{ github.repository }}:${{ github.sha }}" '$u|@uri')" > /dev/null
          echo "Deploy triggered"
