name: ledger-service CI

on:
  push:
    branches: [main, feat/guided-visual-ledger]
    paths: ["ledger-service/**", "infra/**", ".github/workflows/ledger-ci.yml"]
  pull_request:
    paths: ["ledger-service/**", "infra/**", ".github/workflows/ledger-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ledger-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start real Postgres and ElasticMQ (SQS) containers via Testcontainers.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/verify-deployment.test.mjs
      - run: ./mvnw -B verify

  jvm-image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ledger-service
          push: false
          tags: ledger-service:jvm
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Native build → runtime smoke test → publish to GHCR → deploy to Render.
  native:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ledger" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          cache: maven
      - name: Compile native executable
        working-directory: ledger-service
        run: ./mvnw -B -Pnative -DskipTests native:compile
      - name: Smoke test the native binary
        env:
          LEDGER_API_KEY: ci-native-smoke-key-not-a-real-secret-0001
        working-directory: ledger-service
        run: |
          ./target/ledger-service > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 1; done
          scripts/smoke.sh http://localhost:8080 || { cat app.log; exit 1; }
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ledger-service
          file: ledger-service/Dockerfile.native
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: actions/setup-node@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 22
      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          LEDGER_URL: ${{ vars.LEDGER_URL }}
          LEDGER_API_KEY: ${{ secrets.LEDGER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ] || [ -z "$LEDGER_URL" ] || [ "${#LEDGER_API_KEY}" -lt 32 ]; then
            echo "Deployment blocked: configure Render API access, service ID, URL and matching service key."
            exit 1
          fi
          payload=$(jq -cn --arg image "ghcr.io/${{ github.repository }}:${{ github.sha }}" '{imageUrl:$image}')
          export RENDER_DEPLOY_ID=$(curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"             -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' --data "$payload" | jq -er .id)
          [ -n "$RENDER_DEPLOY_ID" ] || { echo "Render returned no deployment ID"; exit 1; }
          echo "Deploy requested; verifying the requested rollout and running service."
          node ledger-service/scripts/verify-deployment.mjs
