name: ledger-service CI

on:
  push:
    branches: [main]
    paths: ["ledger-service/**", ".github/workflows/ledger-ci.yml"]
  pull_request:
    paths: ["ledger-service/**", ".github/workflows/ledger-ci.yml"]

defaults:
  run:
    working-directory: ledger-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start a real Postgres through Testcontainers (Docker is preinstalled on the runner).
      - run: ./mvnw -B verify

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ledger-service
          push: false
          tags: ledger-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
