name: assistant CI

concurrency:
  group: assistant-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ["assistant/**", "docs/API.md", "docs/GITHUB.md", ".github/workflows/assistant-ci.yml"]
  pull_request:
    paths: ["assistant/**", "docs/API.md", "docs/GITHUB.md", ".github/workflows/assistant-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: assistant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assistant/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
